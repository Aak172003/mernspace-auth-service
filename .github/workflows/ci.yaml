# Every job executes in a separate context

name: CI

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main

jobs:
    build-and-test:
        name: Build the project
        runs-on: ubuntu-latest
        env:
            DB_HOST: ${{ secrets.DB_HOST }}
            DB_PORT: ${{ secrets.DB_PORT }}
            DB_USERNAME: ${{ secrets.DB_USERNAME }}
            DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
            DB_NAME: ${{ secrets.DB_NAME }}
            REFRESH_SECRET_KEY: ${{ secrets.REFRESH_SECRET_KEY }}
            JWKS_URI: ${{ secrets.JWKS_URI }}
            PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}

        steps:
            - name: Checkout Code
              uses: actions/checkout@v3

            - name: Install Dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint:check

            - name: Read Secret Keys
              run: |
                  if [ "$DB_NAME" == "postgres" ]; then
                    echo "✅ DB_NAME matches postgres"
                  else
                    echo "❌ DB_NAME does not match postgres"
                  fi

                  if [ "$DB_PASSWORD" == "5H4Co2aFmRKy6dKv" ]; then
                    echo "✅ DB_PASSWORD matches expected secret"
                  else
                    echo "❌ DB_PASSWORD does not match expected secret"
                  fi

            - name: Start Supabase CLI and PostgreSQL
              uses: supabase/setup-cli@v1
              with:
                  version: latest

            - name: Init and Start Supabase
              run: |
                  supabase init
                  supabase db start
                  if supabase db status | grep -q "is running"; then
                    echo "✅ Supabase/PostgreSQL database setup successfully"
                  else
                    echo "❌ Supabase/PostgreSQL database setup failed"
                    exit 1
                  fi

            - name: Test and Coverage
              run: npm run test

            - name: Build TypeScript
              run: npm run build

            - name: SonarCloud Scan
              uses: SonarSource/sonarcloud-github-action@master
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    build-and-push-docker:
        name: Build and Push Docker Image
        needs: build-and-test
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
            IMAGE_NAME: aakash1707/mernspace-auth-service
            IMAGE_TAG: build-${{ github.run_number }}

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v3

            - name: Log into Docker Hub
              uses: docker/login-action@v1
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_PASSWORD }}

            - name: Build Docker Image
              run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -f docker/prod/Dockerfile .

            - name: Push Docker Image to Docker Hub
              run: docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
